$projectBuilding:

  $commonSettings:

    $selectiveExecutions:

      StaticPreview:

        $tasksAndSourceFilesSelection:

          $markupProcessing: [ StaticPreview, Pages ]
          $stylesProcessing: [ Shared, ExternalSharedGUI_Components ]

        $browserLiveReloadingSetupID: StaticPreview
        
        $processingOnDemand:
          $enabled: true
          $fullInitialBuilding: true

      Application:

        $tasksAndSourceFilesSelection:

          $markupProcessing: [ RazorPages, RazorLayouts, RazorGUI_Components ]
          $stylesProcessing: [ Shared, ExternalSharedGUI_Components ]

    $filesWatching:
    
      $relativePathsOfExcludeDirectories:
        - Data
        - LocalDatabase
        - Platforms
        - Properties
        - Services
        - SharedState
        - wwwroot


  $markupProcessing:

    $common:
      $buildingModeDependent:
        $localDevelopment: { $mustResolveResourcesPointersToRelativePaths: true }
        $production: { $mustResolveResourcesPointersToRelativePaths: true }

    $staticPreview:

      $stateDependentPagesVariations:

        $specificationFileRelativePath: StaticPreview/PagesStateDependentVariations.yaml
      
      $importsFromStaticDataFiles:

        - $importedVariableName: $$rawMockData
          $fileRelativePath: StaticPreview/StaticPreviewMockData.json
        - $importedVariableName: $$BusinessRules
          $fileRelativePath: StaticPreview/BusinessRules.json

    $entryPointsGroups:

      StaticPreview:

        $sourceFilesTopDirectoryRelativePath: StaticPreview
        $sourceFilesSelection:
          $prefixesOfExcludedSubdirectories: "_"
          $prefixesOfExcludeFiles: "_"

        $buildingModeDependent:
          $staticPreview:
            $outputTopDirectoryRelativePath: StaticPreview/Build

      Pages:

        $sourceFilesTopDirectoryRelativePath: Pages
        
        $sourceFilesSelection:
          # TODO 一時的に
          $penultimateNamesExtensionsOfExcludedFiles__withOrWithoutLeadingDots: "razor"
          $prefixesOfExcludedSubdirectories: "_"
          $prefixesOfExcludeFiles: "_"

        $buildingModeDependent:
          $staticPreview:
            $outputTopDirectoryRelativePath: StaticPreview/Build
            
        $localization:

          $localeConstantName: $$LOCALE
          $stringResourcesFileRelativePath: StaticPreview/StringResourcesForStaticPreview.json
          $localizedStringResourcesConstantName: $$localizedStringResources
          $nameOfConstantForInterpolationToLangHTML_Attribute: $$HTML_TAG_LANG_ATTRIBUTE_VALUE

          $locales:

            english:

              $localeConstantValue: ENGLISH
              $outputFileInterimNameExtensionWithoutDot: english
              $keyInLocalizedStringResourcesObject: $$english
              $valueOfConstantForInterpolationToLangHTML_Attribute: "en"

            japanese:

              $localeConstantValue: JAPANESE
              $outputFileInterimNameExtensionWithoutDot: japanese
              $keyInLocalizedStringResourcesObject: $$japanese
              $valueOfConstantForInterpolationToLangHTML_Attribute: "ja"
              
      RazorPages:
      
        $sourceFilesTopDirectoryRelativePath: Pages
        $sourceFilesSelection:
          $onlyWithPenultimateFileNamesExtensions__withOrWithoutLeadingDots: "razor"
          $prefixesOfExcludedSubdirectories: "_"
          $prefixesOfExcludeFiles: "_"

        $outputFormat: razor

        $buildingModeDependent:
          $localDevelopment:
            $outputTopDirectoryRelativePath: Pages

      RazorLayouts:

        $sourceFilesTopDirectoryRelativePath: Layouts
        $sourceFilesSelection:
          $onlyWithPenultimateFileNamesExtensions__withOrWithoutLeadingDots: "razor"
          $prefixesOfExcludedSubdirectories: "_"
          $prefixesOfExcludeFiles: "_"

        $outputFormat: razor

        $buildingModeDependent:
          $localDevelopment:
            $outputTopDirectoryRelativePath: Layouts

      RazorGUI_Components:

        $sourceFilesTopDirectoryRelativePath: SharedGUI_Components
        $sourceFilesSelection:
          $onlyWithPenultimateFileNamesExtensions__withOrWithoutLeadingDots: "razor"
          $namesOfExcludeSubdirectories: External
          $prefixesOfExcludedSubdirectories: "_"
          $prefixesOfExcludeFiles: "_"

        $outputFormat: razor

        $buildingModeDependent:
          $localDevelopment:
            $outputTopDirectoryRelativePath: SharedGUI_Components
            
    $routing:

      $specificationFileRelativePath: StaticPreview/Routing/Routing.yaml
      $variable: routing
      $localizations:
        english: StaticPreview/Routing/Routing.english.yaml
        japanese: StaticPreview/Routing/Routing.japanese.yaml

  $stylesProcessing:

    $entryPointsGroups:

      Shared:

        $sourceFilesTopDirectoryRelativePath: Resources/Styles
        $sourceFilesSelection:
          $prefixesOfExcludedSubdirectories: "_"
          $prefixesOfExcludeFiles: "_"

        $buildingModeDependent:
          $staticPreview: { $outputTopDirectoryRelativePath: StaticPreview/Build }
          $localDevelopment:
            $outputTopDirectoryRelativePath: wwwroot
            $sourcemaps: false
            $revisioning: { $disable: true }
          $production:
            $outputTopDirectoryRelativePath: wwwroot
            $revisioning: { $disable: true }
            
      ExternalSharedGUI_Components:
      
        $singleEntryPointSourceFileRelativePath: SharedGUI_Components/External/ExternalSharedGUI_Components.styl
        $buildingModeDependent:
          $staticPreview: { $outputTopDirectoryRelativePath: StaticPreview/Build }
          $localDevelopment:
            $outputTopDirectoryRelativePath: wwwroot
            $sourcemaps: false
            $revisioning: { $disable: true }
          $production:
            $outputTopDirectoryRelativePath: wwwroot
            $revisioning: { $disable: true }


  $browserLiveReloading:

    $setups:

      StaticPreview:

        $localServer:

          $rootDirectoryRelativePath: StaticPreview/Build
          $customStartingFileNameWithExtension: StaticPreviewAnywherePage.html
          
        $openInBrowsers: chrome

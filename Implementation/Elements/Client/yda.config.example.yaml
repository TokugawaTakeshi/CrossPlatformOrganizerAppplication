$projectBuilding:

  $commonSettings:

    $selectiveExecutions:

      StaticPreview:

        $tasksAndSourceFilesSelection:

          $markupProcessing: [ StaticPreviewAnywherePage, ApplicationPagesForStaticPreview ]
          $stylesProcessing: [ Shared, ExternalSharedGUI_Components, InternalSharedGUI_Components, Layouts, Pages ]

        $browserLiveReloadingSetupID: StaticPreview

      Application:

        $tasksAndSourceFilesSelection:

          $markupProcessing: [ RazorPages, RazorLayouts, RazorGUI_Components ]
          $stylesProcessing: [ Shared, ExternalSharedGUI_Components, Pages, Layouts, RazorGUI_Components ]
          
    $filesWatching:

      $relativePathsOfExcludeDirectories:
        - Native
        - Shared/bin
        - Shared/obj
        - Shared/Data
        - Shared/Restrictions
        - Shared/wwwroot
        - StaticPreview/bin
        - StaticPreview/Localizations
        - StaticPreview/obj
        - Web

  $markupProcessing:

    $common:
    
      $buildingModeDependent:
      
        $localDevelopment: { $mustResolveResourcesPointersToRelativePaths: true }

    $staticPreview:

      $stateDependentPagesVariations:

        $specificationFileRelativePath: StaticPreview/PagesStateDependentVariations.Sample.yaml
        
      $importsFromStaticDataFiles:

        - $importedVariableName: $$rawMockData
          $fileRelativePath: StaticPreview/Data.Sample.StaticPreview.json
        - $importedVariableName: $$BusinessRules
          $fileRelativePath: StaticPreview/BusinessRules.Sample.StaticPreview.json

    $entryPointsGroups:

      StaticPreviewAnywherePage:

        $singleEntryPointSourceFileRelativePath: StaticPreview/StaticPreviewAnywherePage.pug
        $buildingModeDependent:
          $staticPreview:
            $outputTopDirectoryRelativePath: StaticPreview/Build

      ApplicationPagesForStaticPreview:

        $sourceFilesTopDirectoryRelativePath: Shared/Pages
        $sourceFilesSelection:
          $onlyWithPenultimateFileNamesExtensions__withOrWithoutLeadingDots: "static"
          $prefixesOfExcludedSubdirectories: "_"
          $prefixesOfExcludeFiles: "_"

        $localization:

          $stringResourcesFileRelativePath: StaticPreview/StringResources.Sample.StaticPreview.json
          $localizedStringResourcesConstantName: $$localizedStringResources
          $localeConstantName: $$LOCALE
          $nameOfConstantForInterpolationToLangHTML_Attribute: $$HTML_TAG_LANG_ATTRIBUTE_VALUE

          $locales:

            english:

              $outputFileInterimNameExtensionWithoutDot: english
              $localeConstantValue: ENGLISH
              $keyInLocalizedStringResourcesObject: ENGLISH
              $valueOfConstantForInterpolationToLangHTML_Attribute: "en"

            japanese:

              $outputFileInterimNameExtensionWithoutDot: japanese
              $localeConstantValue: JAPANESE
              $keyInLocalizedStringResourcesObject: JAPANESE
              $valueOfConstantForInterpolationToLangHTML_Attribute: "ja"

        $buildingModeDependent:
          $staticPreview:
            $outputTopDirectoryRelativePath: StaticPreview/Build
            
      RazorPages:

        $sourceFilesTopDirectoryRelativePath: Shared/Pages
        $sourceFilesSelection:
          $onlyWithPenultimateFileNamesExtensions__withOrWithoutLeadingDots: "razor"
          $prefixesOfExcludedSubdirectories: "_"
          $prefixesOfExcludeFiles: "_"

        $outputFormat: razor

        $buildingModeDependent:
          $localDevelopment:
            $outputTopDirectoryRelativePath: Shared/Pages

      RazorLayouts:

        $sourceFilesTopDirectoryRelativePath: Shared/Layouts
        $sourceFilesSelection:
          $onlyWithPenultimateFileNamesExtensions__withOrWithoutLeadingDots: "razor"
          $prefixesOfExcludedSubdirectories: "_"
          $prefixesOfExcludeFiles: "_"

        $outputFormat: razor

        $buildingModeDependent:
          $localDevelopment:
            $outputTopDirectoryRelativePath: Shared/Layouts

      RazorGUI_Components:

        $sourceFilesTopDirectoryRelativePath: Shared/GUI_Components
        $sourceFilesSelection:
          $onlyWithPenultimateFileNamesExtensions__withOrWithoutLeadingDots: "razor"
          $namesOfExcludeSubdirectories: External
          $prefixesOfExcludedSubdirectories: "_"
          $prefixesOfExcludeFiles: "_"

        $outputFormat: razor

        $buildingModeDependent:
          $localDevelopment:
            $outputTopDirectoryRelativePath: Shared/GUI_Components


  $stylesProcessing:

    $entryPointsGroups:

      Shared:

        $sourceFilesTopDirectoryRelativePath: Shared/Resources/Styles
        $sourceFilesSelection:
          $prefixesOfExcludedSubdirectories: "_"
          $prefixesOfExcludeFiles: "_"

        $buildingModeDependent:
          $staticPreview:
            $outputTopDirectoryRelativePath: StaticPreview/Build/styles
          $localDevelopment:
            $outputTopDirectoryRelativePath: Shared/wwwroot
            $sourcemaps: false
            $revisioning: { $disable: true }

      ExternalSharedGUI_Components:
      
        $singleEntryPointSourceFileRelativePath: Shared/GUI_Components/External/ExternalSharedGUI_Components.styl
        $buildingModeDependent:
          $staticPreview:
            $outputTopDirectoryRelativePath: StaticPreview/Build/styles
          $localDevelopment:
            $outputTopDirectoryRelativePath: Shared/wwwroot
            $sourcemaps: false
            $revisioning: { $disable: true }
            
      InternalSharedGUI_Components:
      
        $singleEntryPointSourceFileRelativePath: Shared/GUI_Components/InternalSharedGUI_Components.styl
        $buildingModeDependent:
          $staticPreview:
            $outputTopDirectoryRelativePath: StaticPreview/Build/styles
          $localDevelopment:
            $outputTopDirectoryRelativePath: Shared/wwwroot
            $revisioning: { $disable: true }
        
      Layouts:

        $sourceFilesTopDirectoryRelativePath: Shared/Layouts
        $sourceFilesSelection:
          $prefixesOfExcludedSubdirectories: "_"
          $prefixesOfExcludeFiles: "_"

        $buildingModeDependent:
          $staticPreview:
            $outputTopDirectoryRelativePath: StaticPreview/Build/styles/layouts
            $outputPathTransformations:
              $segmentsCountRelativeToGroupTopDirectoryWhichMustBeRemoved: 1
          $localDevelopment:
            $outputTopDirectoryRelativePath: Shared/wwwroot/layouts
            $outputPathTransformations:
              $segmentsCountRelativeToGroupTopDirectoryWhichMustBeRemoved: 1
            $sourcemaps: false
              
      Pages:

        $sourceFilesTopDirectoryRelativePath: Shared/Pages
        $sourceFilesSelection:
          $prefixesOfExcludedSubdirectories: "_"
          $prefixesOfExcludeFiles: "_"

        $buildingModeDependent:
          $staticPreview:
            $outputTopDirectoryRelativePath: StaticPreview/Build
          $localDevelopment:
            $outputTopDirectoryRelativePath: Shared/wwwroot/pages
            $outputPathTransformations:
              $segmentsCountRelativeToGroupTopDirectoryWhichMustBeRemoved: 1
            $sourcemaps: false


  $browserLiveReloading:

    $setups:

      StaticPreview:

        $localServer:

          $rootDirectoryRelativePath: StaticPreview/Build
          $customStartingFileNameWithExtension: StaticPreviewAnywherePage.html
          
        $openInBrowsers: chrome
